name: Backend
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: cdp-ci-test-only
          POSTGRES_DB: cdp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:cdp-ci-test-only@127.0.0.1:5432/cdp_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:cdp-ci-test-only@127.0.0.1:5432/cdp_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app tests migrations
      - run: uv run ruff format --check app tests migrations
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
